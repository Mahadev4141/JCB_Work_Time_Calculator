{% extends "calculator/base.html" %}

{% block content %}
<!DOCTYPE html>
<html>

<head>

<title>Add User</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:30px;
}

.container{
width:400px;
margin:auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px #ccc;
}

input{
width:100%;
padding:10px;
margin:10px 0;
}

button{
padding:10px 20px;
background:#198754;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

a{
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h2>Add New User</h2>

<form method="POST">

{% csrf_token %}

<input type="text" name="username" placeholder="Username" required>

<input type="email" name="email" placeholder="Email">

<input type="password" name="password" placeholder="Password" required>
<label>Role</label>

<select name="role" required>
    <option value="Operator">Operator</option>
    <option value="Admin">Admin</option>
</select>

<button type="submit">
Create User
</button>

</form>

<br>

<a href="/users/">⬅ Back</a>

</div>

</body>

</html>
{% endblock %}
