{% extends "calculator/base.html" %}

{% block content %}
<!DOCTYPE html>
<html>

<head>

<title>Reset Password</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
}

.container{

width:400px;
margin:auto;
margin-top:60px;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px #ccc;

}

input{

width:100%;
padding:10px;
margin:10px 0;

}

button{

padding:10px 20px;
background:#198754;
color:white;
border:none;
border-radius:5px;
cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<h2>🔑 Reset Password</h2>

<h3>{{ user.username }}</h3>

<form method="POST">

{% csrf_token %}

<input
type="password"
name="password"
placeholder="New Password"
required>

<br><br>

<button type="submit">

Save Password

</button>

</form>

<br>

<a href="/users/">⬅ Back</a>

</div>

</body>

</html>
{% endblock %}
