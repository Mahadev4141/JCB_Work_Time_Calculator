{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCB Work Time Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#111,#f4c300);
            font-family:Arial,Helvetica,sans-serif;
        }

        .login-card{
            width:420px;
            border-radius:20px;
            padding:35px;
            background:#fff;
            box-shadow:0 15px 40px rgba(0,0,0,.35);
        }

        .logo{
            text-align:center;
            margin-bottom:25px;
        }

        .logo h1{
            color:#f4c300;
            font-weight:bold;
            margin:0;
        }

        .logo p{
            color:#666;
            margin-top:5px;
        }

        .form-control{
            height:48px;
            border-radius:10px;
        }

        .btn-login{
            background:#f4c300;
            color:#000;
            font-weight:bold;
            height:48px;
            border:none;
            border-radius:10px;
            transition:.3s;
        }

        .btn-login:hover{
            background:#111;
            color:#fff;
        }

        .copyright{
            text-align:center;
            color:#777;
            margin-top:20px;
            font-size:13px;
        }
    </style>
</head>

<body>

<div class="login-card">

   <div class="d-flex justify-content-end p-3">

    <a href="{% url 'register' %}" class="btn btn-warning rounded-pill px-4 fw-bold">
        Register
    </a>

</div>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Username</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="fa fa-user"></i>
                </span>
                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Enter Username"
                       required>
            </div>
        </div>

        <div class="mb-4">
            <label>Password</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="fa fa-lock"></i>
                </span>

                <input type="password"
                       name="password"
                       id="password"
                       class="form-control"
                       placeholder="Enter Password"
                       required>

                <button class="btn btn-outline-secondary"
                        type="button"
                        onclick="togglePassword()">
                    <i class="fa fa-eye"></i>
                </button>

            </div>
        </div>

        <button class="btn btn-login w-100">
            <i class="fa fa-right-to-bracket"></i>
            Login
        </button>

    </form>

    <div class="copyright">
        © 2026 JCB Work Time Calculator
     Developed by Mahadev Jalkote
    </div>
</div>

<script>
function togglePassword(){
    let p=document.getElementById("password");

    if(p.type==="password"){
        p.type="text";
    }else{
        p.type="password";
    }
}
</script>

</body>
</html>
