{% extends "calculator/base.html" %}

{% block content %}

<div class="calculator-card">

    <h2>🔑 Change Password</h2>

    <form method="POST">

        {% csrf_token %}

        <label>Current Password</label>
        <input type="password"
               name="current"
               required>

        <label>New Password</label>
        <input type="password"
               name="new"
               required>

        <label>Confirm Password</label>
        <input type="password"
               name="confirm"
               required>

        <br>

        <button type="submit"
                class="btn btn-success w-100">

            Change Password

        </button>

    </form>

</div>

{% endblock %}
